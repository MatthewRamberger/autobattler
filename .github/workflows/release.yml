name: Release APK

on:
  push:
    branches: [main]

# Required secrets:
#   KEYSTORE_FILE       — base64-encoded .jks keystore (run: base64 -w0 release.keystore)
#   KEYSTORE_PASSWORD   — keystore store password
#   KEY_ALIAS           — key alias inside the keystore
#   KEY_PASSWORD        — key password

jobs:
  build-release:
    name: Signed release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Expo prebuild
        run: npx expo prebuild --platform android --no-install

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > android/app/release.keystore

      - name: Build release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=release.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Rename APK with version
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          SHA=${GITHUB_SHA::7}
          mv android/app/build/outputs/apk/release/app-release.apk \
             android/app/build/outputs/apk/release/autobattler-v${VERSION}-${SHA}.apk

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: autobattler-release-${{ github.sha }}
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create GitHub release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          artifacts: android/app/build/outputs/apk/release/*.apk
          makeLatest: true
